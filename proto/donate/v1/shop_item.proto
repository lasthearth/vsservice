syntax = "proto3";

package donate.v1;

import "google/protobuf/timestamp.proto";

enum ItemType {
  ITEM_TYPE_UNSPECIFIED = 0;
  ITEM_TYPE_ITEM = 1;
  ITEM_TYPE_KIT = 2;
}

// One витрина row of a shop item. For kit entries the wire list is DERIVED at
// read time from the captured kit's items (name = game code, quantity = stack
// size, image_url = the game-rendered icon uploaded at capture); the
// hand-typed display list is gone, so what the shop shows is what the
// purchase delivers. The fields stay on the messages so a legacy client's
// entries are simply ignored, and legacy documents' stored rows surface only
// while a kit was never captured.
message KitEntry {
  string name = 1;
  string description = 2;
  string image_url = 3;
  int32 quantity = 4;
}
// Privilege describes a perk granted by the item (e.g. colored nick, Discord role).
message Privilege {
  string text = 1;
  string icon = 2;
}

message ShopItem {
  string id = 1;
  string name = 2;
  string description = 3;
  string image_url = 4;
  int64 price = 5;
  bool is_available = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // Unique identifier used to correlate the item with in-game assets.
  string code = 9;
  ItemType item_type = 10;
  // For kit entries: derived at read time from the captured kit's items.
  // Empty only when the kit was never captured (a hidden pre-capture entry).
  repeated KitEntry entries = 11;
  bool has_discount = 12;
  int32 discount_percent = 13;   // 0..100
  int64 effective_price = 14;    // вычисляемое, для UI
  repeated Privilege privileges = 15;
  google.protobuf.Timestamp discount_starts_at = 16; // nil = открыто слева
  google.protobuf.Timestamp discount_ends_at = 17;   // nil = открыто справа
  bool discount_active = 18;                          // вычисляемое по now(), для UI-бейджа
  // Category of the kit this entry sells ("kit" | "privilege" | "special"),
  // joined at read time from the captured kit. Empty when the kit is missing
  // or the entry predates the field.
  string category = 19;
}

message CreateShopItemRequest {
  string name = 1;
  string description = 2;
  string image_url = 3;
  int64 price = 4;
  string code = 5;
  ItemType item_type = 6;
  // Ignored: the витрина is derived from the captured kit at read time.
  repeated KitEntry entries = 7;
  bool has_discount = 8;
  int32 discount_percent = 9;
  repeated Privilege privileges = 10;
  google.protobuf.Timestamp discount_starts_at = 11;
  google.protobuf.Timestamp discount_ends_at = 12;
}

message CreateShopItemResponse {
  ShopItem item = 1;
}

message UpdateShopItemRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  // Leave empty to keep the existing image.
  string image_url = 4;
  int64 price = 5;
  bool is_available = 6;
  string code = 7;
  ItemType item_type = 8;
  // Ignored: the витрина is derived from the captured kit at read time. The
  // stored legacy rows are wiped by the update.
  repeated KitEntry entries = 9;
  bool has_discount = 10;
  int32 discount_percent = 11;
  repeated Privilege privileges = 12;
  google.protobuf.Timestamp discount_starts_at = 13;
  google.protobuf.Timestamp discount_ends_at = 14;
}

message UpdateShopItemResponse {
  ShopItem item = 1;
}

message DeleteShopItemRequest {
  string id = 1;
}

message DeleteShopItemResponse {}

message ListShopItemsRequest {}

message ListShopItemsResponse {
  repeated ShopItem items = 1;
}

message AdminListAllShopItemsRequest {}

message AdminListAllShopItemsResponse {
  repeated ShopItem items = 1;
}
