message Settlement {
  string id = 1;
  string name = 2;
  SettlementType type = 3;
  string description = 4;
  string diplomacy = 5;
  // Deprecated: use members with the "owner" role instead. Populated with the first owner for compatibility.
  Member leader = 6 [deprecated = true];
  repeated Member members = 7;
  repeated Attachment attachments = 8;
  Vector2 coordinates = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
  int64 imperial_favor = 12;
  repeated TagReference tags = 20 [(google.api.field_behavior) = OPTIONAL];
  // Custom roles defined for this settlement. Empty when roles are disabled.
  repeated Role roles = 21 [(google.api.field_behavior) = OPTIONAL];
  // Whether custom roles are enabled by moderation.
  bool roles_enabled = 22;
  // Public contact information for the settlement (free text).
  string contact_info = 23 [(google.api.field_behavior) = OPTIONAL];
  // Where the settlement's notifier block stands in the world. Unset while no block is placed.
  // The server owns it: a block placed in game writes it, the site only reads it.
  // Filled by every rpc that returns a single settlement. Deliberately unset in List and
  // ListPending, which would need one extra read per row. Always unset for a guild: its herald
  // carries no settlement binding and writes no placement.
  Vector3 notifier_position = 24 [(google.api.field_behavior) = OPTIONAL];
}

enum SettlementType {
  SETTLEMENT_TYPE_UNSPECIFIED = 0;
  CAMP = 1;
  VILLAGE = 2;
  TOWNSHIP = 3;
  CITY = 4;
  PROVINCE = 5;
  // A guild. It is the only tier of its kind and never levels up.
  GUILD = 6;
}

// Which kind of group a document is. The kind decides the membership rules, not the tier: a
// player holds at most one settlement and at most one guild, and the owner of a guild holds no
// settlement.
enum GroupKind {
  GROUP_KIND_UNSPECIFIED = 0;
  GROUP_KIND_SETTLEMENT = 1;
  GROUP_KIND_GUILD = 2;
}

// Permission a custom role can grant. The owner role holds all permissions implicitly.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_INVITE_MEMBER = 1;
  PERMISSION_REVIEW_JOIN_REQUEST = 2;
}

message Role {
  string id = 1;
  string name = 2;
  repeated Permission permissions = 3;
}

message Member {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Role ids held by this member. "owner" denotes a settlement leader.
  repeated string role_ids = 2;
}

message JoinRequest {
  string id = 1;
  string user_id = 2;
  string settlement_id = 3;
}

// Whether an invite link can still be used, and if not, why.
enum InviteLinkStatus {
  INVITE_LINK_STATUS_UNSPECIFIED = 0;
  INVITE_LINK_STATUS_ACTIVE = 1;
  INVITE_LINK_STATUS_EXPIRED = 2;
  INVITE_LINK_STATUS_EXHAUSTED = 3;
  INVITE_LINK_STATUS_REVOKED = 4;
}

message InviteLink {
  string id = 1;
  string settlement_id = 2;
  // Ten characters of Crockford base32; the site serves it at /join/{code}.
  string code = 3;
  string created_by = 4;
  // 0 means unlimited.
  int32 max_uses = 5;
  int32 uses = 6;
  // Absent for a link that never expires.
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp revoked_at = 8;
  google.protobuf.Timestamp created_at = 9;
  // Computed at read time.
  InviteLinkStatus status = 10;
}

message CreateInviteLinkRequest {
  string settlement_id = 1 [(buf.validate.field).required = true];
  // How long the link works, in hours; 0 means it never expires. At most 30 days.
  int32 ttl_hours = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 720
  }];
  // How many players may use the link; 0 means unlimited.
  int32 max_uses = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
}

message ListInviteLinksRequest {
  string settlement_id = 1 [(buf.validate.field).required = true];
}

message ListInviteLinksResponse {
  repeated InviteLink invite_links = 1;
}

message RevokeInviteLinkRequest {
  string settlement_id = 1 [(buf.validate.field).required = true];
  string link_id = 2 [(buf.validate.field).required = true];
}

message GetInviteLinkRequest {
  string code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
}

// What a guest sees when opening an invite link.
message InviteLinkPreview {
  InviteLinkStatus status = 1;
  google.protobuf.Timestamp expires_at = 2;
  // 0 means unlimited.
  int32 max_uses = 3;
  int32 uses = 4;
  string created_by = 5;
  Settlement settlement = 6;
}

