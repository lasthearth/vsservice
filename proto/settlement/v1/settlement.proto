}

message SubmitResponse {
  // True when the server dropped the submitted coordinates because the settlement's notifier
  // block stands. The request then stores the block's position instead (Settlement.notifier_position),
  // and the client must show coordinates as read-only rather than as the value it sent.
  // Always false on a first submission: it has no settlement, so it has no block.
  bool coordinates_locked = 1 [(google.api.field_behavior) = OPTIONAL];
}

