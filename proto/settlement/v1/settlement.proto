message ListNotifierPositionsRequest {}

// Where one herald block stands. The server owns the placement: a block placed in game writes it,
// the site only reads it.
message NotifierPlacement {
  // The settlement the block belongs to; the id List and Get serve. Empty for a neutral herald —
  // a manual tier, a block an admin placed, or one an admin unbound and left standing.
  string settlement_id = 1;
  // The block position in the game world.
  Vector3 position = 2;
  // The label of the pin. A bound herald answers its settlement's current name, so a rename on the
  // site shows at once. A neutral herald answers the name written into the block in game, which
  // stays the placeholder the game gives it until an owner or an admin renames it. Empty for a
  // bound herald whose settlement is gone: a placement outlives DeleteSettlement.
  string name = 3;
}

message ListNotifierPositionsResponse {
  repeated NotifierPlacement placements = 1;
}

