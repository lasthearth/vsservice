syntax = "proto3";

package settlement.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "settlement/v1/tag.proto";

// Settlement and guild management.
//
// Both kinds live in this one service and share every mechanic: profile, roles, invitations, join
// requests, invite links, moderation and the notifier block. What sets them apart is the kind
// (GroupKind) and two membership rules:
//
//   - A player holds at most one settlement and at most one guild, and may hold both at the same
//     time.
//   - The owner of a guild holds no settlement. A guild member may live in a settlement, so this
//     binds only founding a guild, owning one, and taking its ownership.
service SettlementService {
  option (google.api.default_host) = "api.lasthearth.ru";

  // Submit or level-up a settlement request, or submit a guild request.
  //
  // On first call creates a new request; on subsequent calls upgrades an approved settlement.
  // A guild has one tier, so a further guild submission only re-verifies its profile.
  //
  // A guild takes the same fields as a first settlement and goes through the same moderation.
  // The two kinds are independent: one player may hold a settlement and a guild at the same
  // time, and each kind keeps its own request. The owner of a guild holds no settlement, so a
  // guild request is refused while its author belongs to one, and a settlement request is
  // refused while its author owns a guild.
  //
  // While the settlement's notifier block stands, coordinates is ignored on an upgrade: the
  // server takes the block's position instead (see Settlement.notifier_position), so clients
  // should pre-fill the field from it and show it read-only. SubmitResponse.coordinates_locked
  // reports that the server did so.
  //
  // Errors:
  //   - INVALID_ARGUMENT (400): attachments is empty; invalid settlement type
  //   - ALREADY_EXISTS (409): a request of this kind is already pending
  //   - FAILED_PRECONDITION (400): the author of a guild request belongs to a settlement, or the
  //     author of a settlement request owns a guild
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - UNAVAILABLE (503): the notifier position could not be read; retry
  //   - INTERNAL (500): storage upload or database failure
  rpc Submit(SubmitRequest) returns (SubmitResponse) {
    option (google.api.http) = {
      post: "/v1/settlements"
      body: "*"
    };
  }

  // Get settlement by ID. notifier_position is set while the settlement's notifier block stands.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement not found
  //   - INTERNAL (500): database failure
  rpc Get(GetRequest) returns (GetResponse) {
    option (google.api.http) = {get: "/v1/settlements/{id}"};
  }

  // Get the settlement a user belongs to. Guilds are not served here: read both groups with
  // GetUserMemberships.
  //
  // Errors:
  //   - NOT_FOUND (404): the user belongs to no settlement
  //   - INTERNAL (500): database failure
  rpc GetByUserId(GetByUserIdRequest) returns (GetByUserIdResponse) {
    option (google.api.http) = {get: "/v1/users/{user_id}/settlements"};
  }

  // Get both groups a user belongs to: their settlement and their guild.
  //
  // A player may hold one membership of each kind at the same time. The owner of a guild holds
  // no settlement, so a response with a guild and no settlement is the normal case for a guild
  // founder. Both fields stay unset for a player who belongs to nothing; that is not an error.
  //
  // Errors:
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc GetUserMemberships(GetUserMembershipsRequest) returns (GetUserMembershipsResponse) {
    option (google.api.http) = {get: "/v1/users/{user_id}/memberships"};
  }

  // List approved groups of one kind.
  //
  // kind unset means settlements only, so the public map keeps showing settlements and no guild
  // appears on it. Pass GROUP_KIND_GUILD for the guild catalogue.
  //
  // Errors:
  //   - INTERNAL (500): database failure
  rpc List(ListRequest) returns (ListResponse) {
    option (google.api.http) = {get: "/v1/settlements"};
  }

  // List where every herald block stands. Public, so the map draws every pin in one call instead
  // of one Get per settlement.
  //
  // The list holds the blocks that stand right now: the game server writes a placement when a
  // block is placed and deletes it when the block is broken. Both kinds of herald are here. A
  // bound one belongs to a settlement and answers its id; a neutral one — a manual tier such as a
  // khutor, a block an admin placed, or one an admin unbound and left standing — answers an empty
  // settlement_id, which is how a client tells a neutral pin from a settlement's. A guild herald
  // is neither: it carries no settlement binding and writes no placement, so no guild appears
  // here.
  //
  // Every pin carries the label the map shows: name is the settlement's current name for a bound
  // herald, and the name written into the block in game for a neutral one.
  //
  // The bound pins come first, ordered by settlement_id, then the neutral ones ordered by
  // position. A placement outlives DeleteSettlement, because the block still stands in the world
  // after the group is gone, so an id here may name a group the site no longer serves. A client
  // drops the pins it cannot resolve against List, and keeps the neutral ones.
  //
  // Errors:
  //   - INTERNAL (500): database failure
  rpc ListNotifierPositions(ListNotifierPositionsRequest) returns (ListNotifierPositionsResponse) {
    option (google.api.http) = {get: "/v1/settlements/notifiers"};
  }

  // List pending verification requests. Requires admin privileges.
  //
  // kind unset means both kinds, so the moderation queue never hides a guild request.
  //
  // Errors:
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - PERMISSION_DENIED (403): insufficient privileges
  //   - INTERNAL (500): database failure
  rpc ListPending(ListPendingRequest) returns (ListPendingResponse) {
    option (google.api.http) = {get: "/v1/settlements/verifications"};
  }

  // Approve a settlement or guild request. Requires admin privileges.
  //
  // One transaction: the request becomes approved and the group is created (its id is the
  // request id) or upgraded. A new group gets a mail with its notifier block for the leader —
  // the block of the settlement tier, or the guild herald for a guild; an upgrade notifies every
  // member on the site and mails the owners in game. Nothing is written if any of these fails.
  //
  // The membership rules are checked again inside that transaction, because the author may have
  // joined a group between the submission and the approval: a guild is refused while its author
  // belongs to a settlement, and a first settlement is refused while its author owns a guild.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement request not found
  //   - FAILED_PRECONDITION (400): settlement request already approved; the author of a guild
  //     belongs to a settlement, or the author of a new settlement owns a guild
  //   - ALREADY_EXISTS (409): the author already belongs to a group of this kind
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - PERMISSION_DENIED (403): insufficient privileges
  //   - INTERNAL (500): database failure
  rpc Approve(ApproveRequest) returns (ApproveResponse) {
    option (google.api.http) = {
      post: "/v1/settlements/{id}/verification:approve"
      body: "*"
    };
  }

  // Reject a settlement request. Requires admin privileges.
  //
  // Errors:
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - PERMISSION_DENIED (403): insufficient privileges
  //   - INTERNAL (500): database failure
  rpc Reject(RejectRequest) returns (RejectResponse) {
    option (google.api.http) = {
      post: "/v1/settlements/{id}/verification:reject"
      body: "*"
    };
  }

  // Get the verification status of one kind of request for a user. Each kind keeps its own
  // request, so kind selects which one is answered; unset means the settlement request.
  //
  // Errors:
  //   - NOT_FOUND (404): no request of this kind found for the user
  //   - INTERNAL (500): database failure
  rpc VerificationStatus(VerificationStatusRequest) returns (VerificationStatusResponse) {
    option (google.api.http) = {get: "/v1/users/{user_id}/settlements/verification:status"};
  }

  // Remove a member from a settlement. Caller must be the settlement leader or
  // hold the settlements:manage scope.
  //
  // Errors:
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - PERMISSION_DENIED (403): caller is neither the settlement leader nor a moderator
  //   - INTERNAL (500): database failure
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (google.api.http) = {delete: "/v1/settlements/{settlement_id}/members/{user_id}"};
  }

  // Get all pending invitations for a settlement. Caller must be the settlement leader.
  //
  // Errors:
  //   - PERMISSION_DENIED (403): caller is not the settlement leader
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc GetInvitations(GetInvitationsRequest) returns (GetInvitationsResponse) {
    option (google.api.http) = {get: "/v1/settlements/{settlement_id}/invitations"};
  }

  // Get all invitations belonging to a specific user. Caller must match user_id.
  //
  // Errors:
  //   - PERMISSION_DENIED (403): user_id in request does not match authenticated user
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc GetUserInvitations(GetUserInvitationsRequest) returns (GetUserInvitationsResponse) {
    option (google.api.http) = {get: "/v1/users/{user_id}/settlements/invitations"};
  }

  // Accept an invitation to join a settlement or a guild. The membership rules are checked again
  // here, because the caller may have joined another group since the invitation was written.
  //
  // Errors:
  //   - NOT_FOUND (404): invitation not found
  //   - ALREADY_EXISTS (409): caller already belongs to a group of this kind
  //   - FAILED_PRECONDITION (400): caller owns a guild and the invitation leads to a settlement
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse) {
    option (google.api.http) = {post: "/v1/settlements/invitations/{invitation_id}:accept"};
  }

  // Reject an invitation to join a settlement.
  //
  // Errors:
  //   - NOT_FOUND (404): invitation not found for authenticated user
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc RejectInvitation(RejectInvitationRequest) returns (RejectInvitationResponse) {
    option (google.api.http) = {post: "/v1/settlements/invitations/{invitation_id}:reject"};
  }

  // Invite a user to join a settlement or a guild. Requires the invite_member permission (owners
  // pass).
  //
  // The membership rules of the target are checked against the invited player now, so no
  // invitation is stored that the player could never accept.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement not found
  //   - PERMISSION_DENIED (403): caller lacks the invite_member permission
  //   - ALREADY_EXISTS (409): the player already belongs to a group of this kind
  //   - FAILED_PRECONDITION (400): the player owns a guild and the target is a settlement
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse) {
    option (google.api.http) = {
      post: "/v1/settlements/{settlement_id}/invitations"
      body: "*"
    };
  }

  // Revoke a pending invitation. Caller must be the settlement leader.
  //
  // Errors:
  //   - PERMISSION_DENIED (403): caller is not the settlement leader
  //   - NOT_FOUND (404): invitation not found
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse) {
    option (google.api.http) = {
      post: "/v1/settlements/{settlement_id}/invitations/{invitation_id}:revoke"
      body: "*"
    };
  }

  // Update settlement name, description and attachments. Caller must be the settlement leader.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement not found
  //   - PERMISSION_DENIED (403): caller is not the settlement leader
  //   - INVALID_ARGUMENT (400): attachments is empty; invalid attachment url
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc UpdateSettlement(UpdateSettlementRequest) returns (UpdateSettlementResponse) {
    option (google.api.http) = {
      patch: "/v1/settlements/{id}"
      body: "*"
    };
  }

  // Admin update of settlement diplomacy status. Requires settlements:manage scope.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement not found
  //   - PERMISSION_DENIED (403): missing settlements:manage scope
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc AdminUpdateSettlement(AdminUpdateSettlementRequest) returns (AdminUpdateSettlementResponse) {
    option (google.api.http) = {
      patch: "/v1/admin/settlements/{id}"
      body: "*"
    };
  }

  // Add imperial favor points to a settlement. Requires settlements:manage scope.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement not found
  //   - INVALID_ARGUMENT (400): amount must be positive
  //   - PERMISSION_DENIED (403): missing settlements:manage scope
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc AddImperialFavor(AddImperialFavorRequest) returns (AddImperialFavorResponse) {
    option (google.api.http) = {
      post: "/v1/admin/settlements/{settlement_id}/imperial-favor:add"
      body: "*"
    };
  }

  // Deduct imperial favor points from a settlement. Requires settlements:manage scope.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement not found
  //   - INVALID_ARGUMENT (400): amount must be positive; insufficient favor balance
  //   - PERMISSION_DENIED (403): missing settlements:manage scope
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc DeductImperialFavor(DeductImperialFavorRequest) returns (DeductImperialFavorResponse) {
    option (google.api.http) = {
      post: "/v1/admin/settlements/{settlement_id}/imperial-favor:deduct"
      body: "*"
    };
  }

  // List imperial favor log entries for a settlement. Requires settlements:manage scope.
  //
  // Errors:
  //   - PERMISSION_DENIED (403): missing settlements:manage scope
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc ListImperialFavorLogs(ListImperialFavorLogsRequest) returns (ListImperialFavorLogsResponse) {
    option (google.api.http) = {get: "/v1/admin/settlements/{settlement_id}/imperial-favor/logs"};
  }

  // Transfer Imperial Favor from one settlement to another.
  // Caller must be the leader of from_settlement_id.
  //
  // Errors:
  //   - INVALID_ARGUMENT (400): amount <= 0 or missing fields
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - PERMISSION_DENIED (403): caller is not the leader of from_settlement_id
  //   - FAILED_PRECONDITION (412): insufficient imperial favor balance
  //   - INTERNAL (500): database failure
  rpc TransferImperialFavor(TransferImperialFavorRequest) returns (TransferImperialFavorResponse) {
    option (google.api.http) = {
      post: "/v1/settlements/{from_settlement_id}/imperial-favor:transfer"
      body: "*"
    };
  }

  // Add a tag to a settlement. Requires tags:manage privilege.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement or tag not found
  //   - ALREADY_EXISTS (409): settlement already has this tag
  //   - FAILED_PRECONDITION (400): tag is not active; too many tags limit reached
  //   - PERMISSION_DENIED (403): requires tags:manage privilege
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc AddTagToSettlement(AddTagToSettlementRequest) returns (AddTagToSettlementResponse) {
    option (google.api.http) = {
      post: "/v1/settlements/{settlement_id}/tags"
      body: "*"
    };
  }

  // Remove a tag from a settlement. Requires tags:manage privilege.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement or tag not found
  //   - PERMISSION_DENIED (403): requires tags:manage privilege
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc RemoveTagFromSettlement(RemoveTagFromSettlementRequest) returns (RemoveTagFromSettlementResponse) {
    option (google.api.http) = {delete: "/v1/settlements/{settlement_id}/tags/{tag_id}"};
  }

  // Create a join request to a settlement or a guild. The caller must hold no membership of that
  // kind yet, and a guild owner cannot apply to a settlement.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement not found
  //   - ALREADY_EXISTS (409): caller already belongs to a group of this kind, or already applied here
  //   - FAILED_PRECONDITION (400): caller owns a guild and the target is a settlement
  //   - RESOURCE_EXHAUSTED (429): caller has reached the active join-request limit for this kind
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc CreateJoinRequest(CreateJoinRequestRequest) returns (CreateJoinRequestResponse) {
    option (google.api.http) = {
      post: "/v1/settlements/{settlement_id}/join-requests"
      body: "*"
    };
  }

  // Cancel the caller's own join request.
  //
  // Errors:
  //   - NOT_FOUND (404): join request not found for the caller
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc CancelJoinRequest(CancelJoinRequestRequest) returns (CancelJoinRequestResponse) {
    option (google.api.http) = {post: "/v1/settlements/join-requests/{join_request_id}:cancel"};
  }

  // List the caller's own active join requests.
  //
  // Errors:
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc GetMyJoinRequests(GetMyJoinRequestsRequest) returns (GetMyJoinRequestsResponse) {
    option (google.api.http) = {get: "/v1/users/{user_id}/settlements/join-requests"};
  }

  // List join requests for a settlement. Caller needs the review_join_request permission or owner.
  //
  // Errors:
  //   - PERMISSION_DENIED (403): caller lacks the review_join_request permission
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc ListJoinRequests(ListJoinRequestsRequest) returns (ListJoinRequestsResponse) {
    option (google.api.http) = {get: "/v1/settlements/{settlement_id}/join-requests"};
  }

  // Approve a join request. Caller needs the review_join_request permission or owner. The
  // membership rules are checked again against the applicant, who may have joined another group
  // since the application.
  //
  // Errors:
  //   - NOT_FOUND (404): join request not found
  //   - ALREADY_EXISTS (409): applicant already belongs to a group of this kind
  //   - FAILED_PRECONDITION (400): applicant owns a guild and the target is a settlement
  //   - PERMISSION_DENIED (403): caller lacks the review_join_request permission
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc ApproveJoinRequest(ApproveJoinRequestRequest) returns (ApproveJoinRequestResponse) {
    option (google.api.http) = {post: "/v1/settlements/{settlement_id}/join-requests/{join_request_id}:approve"};
  }

  // Reject a join request. Caller needs the review_join_request permission or owner.
  //
  // Errors:
  //   - NOT_FOUND (404): join request not found
  //   - PERMISSION_DENIED (403): caller lacks the review_join_request permission
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc RejectJoinRequest(RejectJoinRequestRequest) returns (RejectJoinRequestResponse) {
    option (google.api.http) = {post: "/v1/settlements/{settlement_id}/join-requests/{join_request_id}:reject"};
  }

  // Create a custom role in a settlement. Owner only. Ignored while roles are disabled.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement not found
  //   - FAILED_PRECONDITION (400): roles disabled; role limit reached
  //   - PERMISSION_DENIED (403): caller is not an owner
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (google.api.http) = {
      post: "/v1/settlements/{settlement_id}/roles"
      body: "*"
    };
  }

  // Update a custom role's name or permissions. Owner only.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement or role not found
  //   - FAILED_PRECONDITION (400): roles disabled
  //   - PERMISSION_DENIED (403): caller is not an owner
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (google.api.http) = {
      patch: "/v1/settlements/{settlement_id}/roles/{role_id}"
      body: "*"
    };
  }

  // Delete a custom role. Owner only. The role is unassigned from all members.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement or role not found
  //   - PERMISSION_DENIED (403): caller is not an owner
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (google.api.http) = {delete: "/v1/settlements/{settlement_id}/roles/{role_id}"};
  }

  // Assign a custom role to a member. Owner only. The owner role cannot be assigned here.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement, role, or member not found
  //   - FAILED_PRECONDITION (400): roles disabled; cannot assign the owner role
  //   - PERMISSION_DENIED (403): caller is not an owner
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse) {
    option (google.api.http) = {
      post: "/v1/settlements/{settlement_id}/members/{user_id}/roles"
      body: "*"
    };
  }

  // Unassign a custom role from a member. Owner only.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement or member not found
  //   - PERMISSION_DENIED (403): caller is not an owner
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc UnassignRole(UnassignRoleRequest) returns (UnassignRoleResponse) {
    option (google.api.http) = {delete: "/v1/settlements/{settlement_id}/members/{user_id}/roles/{role_id}"};
  }

  // Transfer ownership: grant owner to a member and drop it from the caller. Owner only.
  // The owner count is preserved, so this cannot be used to add owners.
  //
  // Ownership of a guild cannot go to a member who lives in a settlement: a guild owner holds no
  // settlement.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement or target member not found
  //   - FAILED_PRECONDITION (400): the target owns a guild and lives in a settlement
  //   - PERMISSION_DENIED (403): caller is not an owner
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse) {
    option (google.api.http) = {
      post: "/v1/settlements/{settlement_id}/ownership:transfer"
      body: "*"
    };
  }

  // Leave the settlement or guild the caller belongs to.
  //
  // The last owner of a settlement cannot leave: an admin grants the role to another member or
  // deletes the settlement.
  //
  // A guild whose last owner is also its only member is disbanded instead. The owner of a guild
  // belongs to no settlement, so without this the founder could never join one. Disbanding deletes
  // the guild, its invitations and its applications, so it takes an explicit `disband: true`;
  // without it the call answers FAILED_PRECONDITION and changes nothing. A guild with other members
  // is never disbanded: transfer the ownership to one of them instead.
  //
  // Errors:
  //   - NOT_FOUND (404): caller does not belong to this group, or the group is gone
  //   - FAILED_PRECONDITION (400): caller is the last owner of a settlement; caller is the last
  //     owner of a guild and sent no `disband`; the guild gained a member since the caller read it
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc LeaveSettlement(LeaveSettlementRequest) returns (LeaveSettlementResponse) {
    option (google.api.http) = {post: "/v1/settlements/{settlement_id}:leave"};
  }

  // Update the settlement's public contact info. Owner only.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement not found
  //   - INVALID_ARGUMENT (400): contact info too long or contains forbidden characters
  //   - PERMISSION_DENIED (403): caller is not an owner
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc UpdateContactInfo(UpdateContactInfoRequest) returns (UpdateContactInfoResponse) {
    option (google.api.http) = {
      patch: "/v1/settlements/{settlement_id}/contact-info"
      body: "*"
    };
  }

  // Admin: grant the owner role to a member. Requires settlements:manage scope.
  //
  // A guild owner holds no settlement, so the owner role of a guild cannot go to a member who
  // lives in one.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement or member not found
  //   - FAILED_PRECONDITION (400): the member is already an owner, or lives in a settlement and
  //     the target is a guild
  //   - PERMISSION_DENIED (403): missing settlements:manage scope
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc AddOwner(AddOwnerRequest) returns (AddOwnerResponse) {
    option (google.api.http) = {
      post: "/v1/admin/settlements/{settlement_id}/owners"
      body: "*"
    };
  }

  // Admin: revoke the owner role from a member. Requires settlements:manage scope.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement or member not found
  //   - FAILED_PRECONDITION (400): cannot revoke the last owner
  //   - PERMISSION_DENIED (403): missing settlements:manage scope
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc RemoveOwner(RemoveOwnerRequest) returns (RemoveOwnerResponse) {
    option (google.api.http) = {delete: "/v1/admin/settlements/{settlement_id}/owners/{user_id}"};
  }

  // Admin: enable or disable custom roles for a settlement. Requires settlements:manage scope.
  // When disabled, roles are neither returned nor applied.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement not found
  //   - PERMISSION_DENIED (403): missing settlements:manage scope
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc SetRolesEnabled(SetRolesEnabledRequest) returns (SetRolesEnabledResponse) {
    option (google.api.http) = {
      post: "/v1/admin/settlements/{settlement_id}/roles:set-enabled"
      body: "*"
    };
  }

  // Admin: permanently delete a settlement, its invitations and join requests. Requires settlements:manage scope.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement not found
  //   - PERMISSION_DENIED (403): missing settlements:manage scope
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc DeleteSettlement(DeleteSettlementRequest) returns (DeleteSettlementResponse) {
    option (google.api.http) = {delete: "/v1/admin/settlements/{settlement_id}"};
  }

  // Admin: send the settlement's notifier block again by in-game mail, e.g. after it was lost.
  // Requires settlements:manage scope. Every call sends one more block.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement not found
  //   - FAILED_PRECONDITION (412): the settlement type has no notifier block, or user_id is not an owner
  //   - PERMISSION_DENIED (403): missing settlements:manage scope
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc ReissueNotifier(ReissueNotifierRequest) returns (ReissueNotifierResponse) {
    option (google.api.http) = {
      post: "/v1/admin/settlements/{settlement_id}/notifier:reissue"
      body: "*"
    };
  }

  // Create a shareable invite link. Requires the invite_member permission (owners pass).
  //
  // Whoever opens the link and holds no membership of the link's kind joins straight away, with
  // no join request: the link is an invitation accepted in advance. A group keeps at most 10
  // usable links at once.
  //
  // Errors:
  //   - INVALID_ARGUMENT (400): ttl_hours outside 0..720 or max_uses outside 0..100
  //   - NOT_FOUND (404): settlement not found
  //   - PERMISSION_DENIED (403): caller lacks the invite_member permission
  //   - RESOURCE_EXHAUSTED (429): the settlement already has 10 usable links
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc CreateInviteLink(CreateInviteLinkRequest) returns (InviteLink) {
    option (google.api.http) = {
      post: "/v1/settlements/{settlement_id}/invite-links"
      body: "*"
    };
  }

  // List a settlement's invite links that were not revoked, newest first (up to 50).
  // Requires the invite_member permission (owners pass).
  //
  // Errors:
  //   - NOT_FOUND (404): settlement not found
  //   - PERMISSION_DENIED (403): caller lacks the invite_member permission
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc ListInviteLinks(ListInviteLinksRequest) returns (ListInviteLinksResponse) {
    option (google.api.http) = {get: "/v1/settlements/{settlement_id}/invite-links"};
  }

  // Revoke an invite link so it stops working. Requires the invite_member permission.
  //
  // Errors:
  //   - NOT_FOUND (404): settlement or link not found
  //   - PERMISSION_DENIED (403): caller lacks the invite_member permission
  //   - FAILED_PRECONDITION (412): the link kept changing under concurrent writes
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc RevokeInviteLink(RevokeInviteLinkRequest) returns (InviteLink) {
    option (google.api.http) = {post: "/v1/settlements/{settlement_id}/invite-links/{link_id}:revoke"};
  }

  // Preview an invite link: its status and the settlement it leads to. Public, so
  // the invite page works for guests before they sign in.
  //
  // Errors:
  //   - NOT_FOUND (404): no link with this code, or its settlement is gone
  //   - INTERNAL (500): database failure
  rpc GetInviteLink(GetInviteLinkRequest) returns (InviteLinkPreview) {
    option (google.api.http) = {get: "/v1/invite-links/{code}"};
  }

  // Join the settlement or guild behind an invite link. Spends one use of the link, adds the
  // caller as a plain member and drops the caller's pending applications to other groups of that
  // kind. The link's creator is notified.
  //
  // Not atomic. The deployment has no replica set, so the use is reserved first and
  // given back if adding the member fails, and that give-back can itself fail and is
  // then only logged. A caller that gets an error must re-read the link rather than
  // assume nothing changed: the use may be spent without the join having landed.
  //
  // Errors:
  //   - NOT_FOUND (404): no link with this code, or its settlement is gone
  //   - ALREADY_EXISTS (409): caller already belongs to a group of this kind
  //   - FAILED_PRECONDITION (412): the link expired, ran out of uses or was revoked; or the caller
  //     owns a guild and the link leads to a settlement
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc JoinByInviteLink(JoinByInviteLinkRequest) returns (JoinByInviteLinkResponse) {
    option (google.api.http) = {post: "/v1/invite-links/{code}:join"};
  }
}

