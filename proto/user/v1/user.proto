syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "rules/v1/rules.proto";

// Represents user specific actions
service UserService {
  option (google.api.default_host) = "api.lasthearth.ru";

  // Update the avatar for a user. Caller must match user_id.
  //
  // Avatar must be at most 3MB and exactly 512x512 pixels; converted to WebP internally.
  //
  // Errors:
  //   - INVALID_ARGUMENT (400): avatar is empty; exceeds 3MB; invalid dimensions (must be 512x512)
  //   - PERMISSION_DENIED (403): cannot update another user's avatar
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): image processing, storage, or SSO failure
  rpc UpdateAvatar(UpdateAvatarRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/users/{user_id}/avatar"
      body: "*"
    };
  }

  // Get user profile by ID.
  //
  // Errors:
  //   - NOT_FOUND (404): user not found
  //   - INTERNAL (500): database failure
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {get: "/v1/users/{user_id}"};
  }

  // Batch get user profiles by IDs.
  //
  // Returns only the users that were found; missing IDs are silently omitted.
  //
  // Errors:
  //   - INVALID_ARGUMENT (400): user_ids is empty or has more than 100 entries
  //   - INTERNAL (500): database failure
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse) {
    option (google.api.http) = {get: "/v1/users:batchGet"};
  }

  // Search users by query string. Requires auth, since it enumerates players by name.
  //
  // Errors:
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse) {
    option (google.api.http) = {get: "/v1/users/search"};
  }

  // Change in-game nickname for a user. Caller must match user_id.
  //
  // Nickname must be 1-15 alphanumeric/underscore/dash characters.
  // Change is subject to a 6-month cooldown per user.
  //
  // Errors:
  //   - INVALID_ARGUMENT (400): invalid nickname format; new nickname same as current
  //   - PERMISSION_DENIED (403): cannot change another user's nickname
  //   - FAILED_PRECONDITION (400): nickname change on cooldown; response includes next allowed date
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc ChangeNickname(ChangeNicknameRequest) returns (ChangeNicknameResponse) {
    option (google.api.http) = {
      put: "/v1/users/{user_id}/nickname"
      body: "*"
    };
  }

  // Change another player's nickname on their behalf, ignoring the cooldown.
  // Requires players:nickname:write.
  //
  // The change is recorded as an ordinary nickname change: the previous name is
  // kept and the player's 6-month cooldown starts now. The player is notified
  // with the reason.
  //
  // Errors:
  //   - INVALID_ARGUMENT (400): invalid nickname format; new nickname same as current;
  //     reason longer than 500 characters
  //   - NOT_FOUND (404): player not found
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - PERMISSION_DENIED (403): missing players:nickname:write
  //   - INTERNAL (500): database failure
  rpc AdminChangeNickname(AdminChangeNicknameRequest) returns (AdminChangeNicknameResponse) {
    option (google.api.http) = {
      put: "/v1/admin/users/{user_id}/nickname"
      body: "*"
    };
  }

  // Allow a player to change their own nickname before the 6-month cooldown
  // expires. Requires players:nickname:grant.
  //
  // The recorded change time is cleared, so ChangeNickname accepts the player's
  // own request immediately; that change then starts a fresh cooldown. The
  // player is notified with the reason.
  //
  // Errors:
  //   - INVALID_ARGUMENT (400): reason longer than 500 characters
  //   - NOT_FOUND (404): player not found
  //   - FAILED_PRECONDITION (400): the player can already change their nickname
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - PERMISSION_DENIED (403): missing players:nickname:grant
  //   - INTERNAL (500): database failure
  rpc AdminGrantNicknameChange(AdminGrantNicknameChangeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/admin/users/{user_id}/nickname:grant"
      body: "*"
    };
  }

  // Replace the caller's description. An empty string removes it.
  //
  // The text is normalized before it is stored: line endings become \n,
  // trailing spaces are cut, more than one empty line in a row becomes one.
  //
  // Errors:
  //   - INVALID_ARGUMENT (400): longer than 500 characters or 8 lines, or
  //     contains control characters
  //   - FAILED_PRECONDITION (400): the caller is not a verified player
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - INTERNAL (500): database failure
  rpc UpdateMyAbout(UpdateMyAboutRequest) returns (User) {
    option (google.api.http) = {
      put: "/v1/users/me/about"
      body: "*"
    };
  }

  // Hide a player's description. Requires players:moderate.
  //
  // The description is removed and the player is notified with the reason;
  // they may write a new one.
  //
  // Errors:
  //   - INVALID_ARGUMENT (400): empty reason
  //   - NOT_FOUND (404): player not found
  //   - UNAUTHENTICATED (401): missing or invalid auth token
  //   - PERMISSION_DENIED (403): missing players:moderate
  //   - INTERNAL (500): database failure
  rpc HideAbout(HideAboutRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/users/{user_id}/about:hide"
      body: "*"
    };
  }

  // Players for the public roster: search by nickname, filter by when they
  // were last in the game, sort and page through.
  //
  // Errors:
  //   - INVALID_ARGUMENT (400): query longer than 32 characters
  //   - INTERNAL (500): database failure
  rpc ListPlayers(ListPlayersRequest) returns (ListPlayersResponse) {
    option (google.api.http) = {get: "/v1/players"};
  }
}

message UpdateAvatarRequest {
  bytes avatar = 1 [(google.api.field_behavior) = REQUIRED];
  string user_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetUserRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message BatchGetUsersRequest {
  // At least 1 and at most 100 user IDs.
  repeated string user_ids = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated = {min_items: 1, max_items: 100}
  ];
}

message BatchGetUsersResponse {
  // Found users, in arbitrary order. Missing IDs are not represented.
  repeated User users = 1;
}

message User {
  string user_id = 1;
  string user_game_name = 2;
  Image avatar = 3;
  string user_name = 4;
  string previous_nickname = 5;
  bool is_online = 6;
  // What the player wrote about themselves: plain text, at most 500
  // characters and 8 lines. Empty when there is none or a moderator hid it.
  string about = 7;
  // When the description was last changed; unset when there is none.
  google.protobuf.Timestamp about_updated_at = 8;

  message Image {
    string original = 1;
    string x96 = 2;
    string x48 = 3;
  }
}

message SearchUsersRequest {
  string query = 1 [(google.api.field_behavior) = REQUIRED];
}

message SearchUsersResponse {
  repeated User users = 1;
}

message ChangeNicknameRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
  string new_nickname = 2 [(google.api.field_behavior) = REQUIRED];
}

message ChangeNicknameResponse {
  string old_nickname = 1;
  string new_nickname = 2;
}

message AdminChangeNicknameRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 1-15 characters: letters, digits, underscore, dash.
  string new_nickname = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {pattern: "^[a-zA-Z0-9_-]{1,15}$"}
  ];
  // Shown to the player in the notification. Optional, at most 500 characters.
  string reason = 3;
}

message AdminChangeNicknameResponse {
  string old_nickname = 1;
  string new_nickname = 2;
  // When the player may change the nickname again.
  google.protobuf.Timestamp next_change_allowed_at = 3;
}

message AdminGrantNicknameChangeRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Shown to the player in the notification. Optional, at most 500 characters.
  string reason = 2;
}

message UpdateMyAboutRequest {
  // The new description; an empty string removes the current one.
  string about = 1;
}

message HideAboutRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Shown to the player in the notification.
  string reason = 2 [(google.api.field_behavior) = REQUIRED];
}

// When a player was last in the game. Each window includes the shorter
// ones: DAY also counts players who are online now.
enum LastSeen {
  // Every player.
  LAST_SEEN_UNSPECIFIED = 0;
  // In the game now.
  LAST_SEEN_ONLINE = 1;
  // Online now or within 24 hours.
  LAST_SEEN_DAY = 2;
  // Within 7 days.
  LAST_SEEN_WEEK = 3;
  // Within 30 days.
  LAST_SEEN_MONTH = 4;
  // More than 30 days ago, or never recorded.
  LAST_SEEN_INACTIVE = 5;
}

// How the roster is ordered.
enum PlayerSort {
  // Same as LAST_SEEN.
  PLAYER_SORT_UNSPECIFIED = 0;
  // Online first, then most recently seen.
  PLAYER_SORT_LAST_SEEN = 1;
  // Most hours first.
  PLAYER_SORT_HOURS = 2;
  // Alphabetical, case-insensitive.
  PLAYER_SORT_NICKNAME = 3;
}

message ListPlayersRequest {
  // Part of the nickname (current or previous), case-insensitive.
  // Shorter than 2 characters after trimming: ignored.
  string query = 1;
  LastSeen last_seen = 2;
  PlayerSort sort = 3;
  // 1-based page number; 0 means 1. A page past the end returns no players.
  int32 page = 4;
  // Default 24, at most 48.
  int32 page_size = 5;
}

message PlayerListItem {
  string user_id = 1;
  string nickname = 2;
  User.Image avatar = 3;
  bool is_online = 4;
  // Unset when the game has never recorded the player.
  google.protobuf.Timestamp last_online = 5;
  double hours_played = 6;
  string about = 7;
}

// How many players each window holds for the same query, so the site can
// show a count on every filter.
message LastSeenCounts {
  int32 all = 1;
  int32 online = 2;
  int32 day = 3;
  int32 week = 4;
  int32 month = 5;
  int32 inactive = 6;
}

message ListPlayersResponse {
  repeated PlayerListItem players = 1;
  // Players matching query and last_seen, ignoring pagination.
  int32 total_size = 2;
  int32 page = 3;
  int32 page_size = 4;
  LastSeenCounts counts = 5;
}
