name: Build and push app to registry

on:
  push:
    branches:
      - master
      - dev

env:
  DOCKER_REGISTRY: ghcr.io

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set DOCKER_IMAGE env (append -dev for dev branch)
        run: |
          # DOCKER_REGISTRY доступна из env
          # If build in dev branch append suffix "-dev"
          if [ "${{ github.ref_name }}" = "dev" ]; then
            SUFFIX="-dev"
          else
            SUFFIX=""
          fi

          echo "TAG_SUFFIX=$SUFFIX" >> $GITHUB_ENV
          echo "DOCKER_IMAGE=$DOCKER_REGISTRY/lasthearth/vsservice$SUFFIX" >> $GITHUB_ENV

      - name: Checkout
        # TODO(supply-chain): replace the mutable tag with a full commit SHA.
        # Owner command: gh api repos/actions/checkout/commits/v4 --jq .sha
        # Then: uses: actions/checkout@<that-sha>  # actions/checkout v4
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # TODO(supply-chain, highest priority): @master is a mutable BRANCH pin, not even a tag.
        # This job holds permissions packages: write and the ghcr.io GITHUB_TOKEN, so whoever
        # controls docker/setup-buildx-action's master head controls the published image.
        # Owner command: gh api repos/docker/setup-buildx-action/commits/master --jq .sha
        # Then: uses: docker/setup-buildx-action@<that-sha>  # master as of <date of the pin>
        uses: docker/setup-buildx-action@master

      - name: Login to container registry
        # TODO(supply-chain): replace the mutable tag with a full commit SHA.
        # Owner command: gh api repos/docker/login-action/commits/v3 --jq .sha
        # Then: uses: docker/login-action@<that-sha>  # docker/login-action v3
        uses: docker/login-action@v3
        id: login
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        # TODO(supply-chain): replace the mutable tag with a full commit SHA. This step publishes
        # the production artifact, so an unpinned action here can replace the pushed image.
        # Owner command: gh api repos/docker/build-push-action/commits/v6 --jq .sha
        # Then: uses: docker/build-push-action@<that-sha>  # docker/build-push-action v6
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
